# Builds the Windows and macOS installers and attaches them to a draft GitHub release.
# Start it from Actions > Release > Run workflow. It does not run on tags: publishing the draft
# creates the tag, and a run then would build again over the published files.
# The release stays a draft until you publish it on GitHub. Installed apps see a new version
# only after it is published, through latest.json on the newest release.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the control page
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test -p sideglance-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update files; the app only installs updates signed with this key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: Sideglance v__VERSION__
          # the tag made on publishing points at the commit that was built
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Unsigned build. See "Install" in the README for the one-time warning on Windows and macOS.
          releaseDraft: true
          # latest.json points Windows at the .exe installer, the one most people install
          updaterJsonPreferNsis: true
          prerelease: false
          args: ${{ matrix.args }}
